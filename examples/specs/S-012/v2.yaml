id: S-012
version: 2
name: RSI reclaim above EMA with ATR target
market:
  symbol: BTCUSDT
  exchange: binance
  tv_symbol: "BINANCE:BTCUSDT"
  timeframe: 4h
period:
  start: 2021-01-01
  end: 2025-12-31
  oos_fraction: 0.3
direction: long
params:
  fast_len: { default: 12, fixed: true }
  slow_len: { default: 100, fixed: true }
  rsi_len: { default: 14, fixed: true }
  atr_len: { default: 14, fixed: true }
  atr_stop: { default: 1.5, range: [1.0, 3.0, 0.5] }
  atr_tp: { default: 3.5, range: [2.0, 5.0, 0.5] }
indicators:
  fast_ema: { fn: ema, src: close, len: $fast_len }
  slow_ema: { fn: ema, src: close, len: $slow_len }
  rsi: { fn: rsi, src: close, len: $rsi_len }
  atr: { fn: atr, len: $atr_len }
entry:
  long:
    all:
      - crosses_above: [fast_ema, slow_ema]
      - gt: [rsi, 40]
exit:
  stop: { atr_mult: $atr_stop }
  target: { atr_mult: $atr_tp }
risk:
  sizing: percent_equity
  value: 100
  initial_capital: 10000
  pyramiding: 0
costs:
  commission_pct: 0.1
  slippage_ticks: 1
  tick_size: 0.01
