id: S-020
version: 1
name: Donchian Channel Breakout
market:
  symbol: BTCUSDT
  exchange: binance
  tv_symbol: "BINANCE:BTCUSDT"
  timeframe: 4h
period:
  start: 2021-01-01
  end: 2025-12-31
  oos_fraction: 0.3
direction: long
params:
  donchian_len: { default: 20, range: [10, 40, 5] }
  atr_stop: { default: 2.0, range: [1.0, 3.0, 0.5] }
indicators:
  upper_band: { fn: highest, src: high, len: $donchian_len }
  atr: { fn: atr, len: 14 }
entry:
  long:
    crosses_above: [close, upper_band]
exit:
  stop: { atr_mult: $atr_stop }
  time: { bars: 40 }
risk:
  sizing: percent_equity
  value: 100
  initial_capital: 10000
  pyramiding: 0
costs:
  commission_pct: 0.1
  slippage_ticks: 1
  tick_size: 0.01
