name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      STRATLAB_HOME: ${{ github.workspace }}/.ci-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Example specs validate
        run: for s in S-001@v1 S-012@v1 S-012@v2 S-020@v1; do stratlab spec validate $s; done
      - name: Switch template is up to date
        run: python switch/build_template.py && git diff --exit-code switch/stratlab.template.yaml
      - name: Offline demo and desk
        run: |
          stratlab demo --budget 40
          stratlab ui
          test -s "$STRATLAB_HOME/artifacts/stratlab-desk.html"
