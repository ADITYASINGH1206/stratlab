name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linter (ruff)
        run: |
          ruff check .

      - name: Run tests (pytest)
        run: |
          pytest -v

      - name: Test CLI spec validation
        run: |
          stratlab spec validate examples/specs/S-001/v1.yaml
          stratlab spec validate examples/specs/S-012/v1.yaml
          stratlab spec validate examples/specs/S-012/v2.yaml
          stratlab spec validate examples/specs/S-020/v1.yaml
