[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stratlab"
version = "0.1.0"
description = "Adversarial trading strategy research desk in Switch"
readme = "README.md"
authors = [{ name = "StratLab Team" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "ccxt>=4.0.0",
    "yfinance>=0.2.0",
    "numpy>=1.26.0",
    "numba>=0.59.0",
    "joblib>=1.3.0",
    "matplotlib>=3.8.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
stratlab = "stratlab.cli:app"

[tool.setuptools.packages.find]
include = ["stratlab*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
